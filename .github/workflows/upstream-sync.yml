name: sync fork with upstream

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      update: ${{ steps.detect.outputs.update }}
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      fork_sha: ${{ steps.detect.outputs.fork_sha }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: local/tabby-cwd
          fetch-depth: 0
          persist-credentials: false

      - name: Check for upstream updates
        id: detect
        shell: bash
        # Lightweight git-only check. Nothing runs past this step when
        # upstream/master is already contained in the fork HEAD.
        run: |
          git fetch https://github.com/herdrdev/herdr.git master:refs/remotes/upstream/master
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/master)"
          FORK_SHA="$(git rev-parse HEAD)"
          echo "upstream: $UPSTREAM_SHA"
          echo "fork:     $FORK_SHA"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$FORK_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "no upstream updates; nothing to do"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Preflight merge
        if: steps.detect.outputs.update == 'true'
        shell: bash
        # Reproduce GitHub's fork sync merge locally. On conflict the job fails
        # before the remote branch is touched; no automatic conflict resolution.
        run: |
          git merge --no-commit --no-ff refs/remotes/upstream/master

      - name: Install Zig 0.15.2
        if: steps.detect.outputs.update == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build release
        if: steps.detect.outputs.update == 'true'
        shell: bash
        # Explicit complete 0.15.2 tree (zig + lib/), matching the fork's
        # resolution rules in scripts/update-herdr.
        run: |
          ZIG="$(readlink -f "$(command -v zig)")"
          export ZIG
          "$ZIG" version
          cargo build --release --locked

  sync:
    needs: validate
    if: needs.validate.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify refs are unchanged
        shell: bash
        # Keep write permission isolated from the job that executes upstream code.
        # If either branch moved after validation, leave the fork untouched.
        run: |
          CURRENT_UPSTREAM_SHA="$(git ls-remote https://github.com/herdrdev/herdr.git refs/heads/master | awk '{print $1}')"
          CURRENT_FORK_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/local/tabby-cwd | awk '{print $1}')"
          test -n "$CURRENT_UPSTREAM_SHA"
          test -n "$CURRENT_FORK_SHA"
          test "$CURRENT_UPSTREAM_SHA" = "${{ needs.validate.outputs.upstream_sha }}" || {
            echo "upstream moved during validation; retry on the next run" >&2
            exit 1
          }
          test "$CURRENT_FORK_SHA" = "${{ needs.validate.outputs.fork_sha }}" || {
            echo "fork branch moved during validation; retry on the next run" >&2
            exit 1
          }

      - name: Sync fork branch
        env:
          GH_TOKEN: ${{ github.token }}
        # Use GitHub's fork-sync API instead of git push. This avoids PATs,
        # force-pushes, and workflow-file push restrictions on GITHUB_TOKEN.
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch='local/tabby-cwd'
